# secalc default configuration
#
# Data: Space Engineers 2 VS2.3 "Drive, Automate & Detonate" (July 2026),
# from spaceengineers2.wiki.gg bot-extracted block pages (URLs below).
# To customize: run `secalc init` to write this file to
# ~/.config/secalc/config-se2.toml, then edit it. Your file only needs the
# keys you want to change; everything else falls back to these defaults.
#
# Units: mass kg, capacity kg (SE2 inventories are mass-limited, there is
# no volume/density model), thrust N, power in each family's power_unit.
# Gravity is given on the command line as a multiple of 9.81 m/s^2.
#
# Table keys ([containers.s15m], [....sizes.s2m]) are arbitrary dot-free
# identifiers: container keys are the CLI shortcuts (matched
# case-insensitively); display text comes from each block's `name`. Because
# the CLI grammar reads digit-leading tokens as masses, container keys must
# start with a letter (letters, digits, '_' or '-' after that).

[settings]
margin = 1.5 # default target thrust-to-weight ratio (-m overrides)

# --- Gravity presets ------------------------------------------------------
# Named values for -g (e.g. `secalc -g palatine ...`); plain numbers still
# work. Preset names follow the same shape rule as container keys (start
# with a letter). Values are multiples of 9.81 m/s^2.

[gravity]
verdure = 1.0    # planet; ~1 g, community-verified (see README, Game data)
palatine = 0.33  # Verdure's moon; https://spaceengineers2.wiki.gg/wiki/Palatine
caligo = 0.416   # Kemik's moon; https://spaceengineers2.wiki.gg/wiki/Caligo
space = 0.0      # convenience: zero gravity

# Starting planets whose gravity the wiki does not document yet — read the
# value off your in-game map screen, then uncomment and fill in:
# kemik = 0.0
# byblos = 0.0

# --- Storage containers -------------------------------------------------

# https://spaceengineers2.wiki.gg/wiki/Cargo_Container_1.5_m
[containers.s15m]
name = "Cargo Container 1.5 m"
mass = 245.17
capacity = 16800

# https://spaceengineers2.wiki.gg/wiki/Cargo_Container_2.5_m
[containers.s25m]
name = "Cargo Container 2.5 m"
mass = 669.08
capacity = 67200

# https://spaceengineers2.wiki.gg/wiki/Cargo_Container_7.5_m
[containers.s75m]
name = "Cargo Container 7.5 m"
mass = 5092.09
capacity = 2150400

# --- Thrusters -----------------------------------------------------------
# Per size: thrust N, mass kg, power in the family's power_unit (per
# thruster, at max thrust).

[thrusters.atmospheric]
name = "Atmospheric"
power_unit = "MW"

# https://spaceengineers2.wiki.gg/wiki/Atmospheric_Thruster_1_m
[thrusters.atmospheric.sizes.s1m]
name = "1 m"
thrust = 40000
mass = 57.98
power = 0.075

# https://spaceengineers2.wiki.gg/wiki/Atmospheric_Thruster_2_m
[thrusters.atmospheric.sizes.s2m]
name = "2 m"
thrust = 287136.3
mass = 464.11
power = 0.65

# https://spaceengineers2.wiki.gg/wiki/Atmospheric_Thruster_5_m
[thrusters.atmospheric.sizes.s5m]
name = "5 m"
thrust = 1516383
mass = 1551.85
power = 2.4

# https://spaceengineers2.wiki.gg/wiki/Atmospheric_Thruster_10_m
[thrusters.atmospheric.sizes.s10m]
name = "10 m"
thrust = 15465370
mass = 8342.74
power = 16

[thrusters.hydrogen]
name = "Hydrogen"
power_unit = "units/s H2" # SE2 tracks hydrogen in unitless units, not liters

# https://spaceengineers2.wiki.gg/wiki/Hydrogen_Thruster_0.5_m
[thrusters.hydrogen.sizes.s05m]
name = "0.5 m"
thrust = 60000
mass = 33.10
power = 0.75

# https://spaceengineers2.wiki.gg/wiki/Hydrogen_Thruster_2_m
[thrusters.hydrogen.sizes.s2m]
